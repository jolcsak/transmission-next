# Dedicated TLS endpoint. The backend relay remains loopback-only.
user www-data;
worker_processes 1;
pid /run/transmission-rpc-tls.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    map $status $security_event {
        default 0;
        400 1; 403 1; 413 1; 414 1; 429 1; 494 1;
    }
    # No URL, query string, Authorization header, username or request body.
    log_format security 'code=$status peer=$remote_addr';
    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 64m;
    limit_conn_zone $binary_remote_addr zone=rpc_clients:1m;
    server {
        listen 0.0.0.0:9091 ssl;
        # Plain HTTP backend for a trusted local TLS terminator such as DSM.
        # Do not publish this port beyond the host or reverse-proxy network.
        listen 0.0.0.0:9092;
        server_name _;
        absolute_redirect off;
        access_log syslog:server=unix:/run/transmission-rpc-security/events.sock,tag=transmission_security security if=$security_event;
        ssl_certificate /config/tls/server.crt;
        ssl_certificate_key /config/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:rpc_tls:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        limit_conn rpc_clients 8;
        location /transmission/ {
            proxy_pass http://127.0.0.1:19091;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
        }
        location = / { return 302 /transmission/web/; }
        location / { return 404; }
    }
}
